{% extends 'base.html' %}
{% block content %}
<div class="mx-auto max-w-lg"><section class="card bg-base-100 shadow"><div class="card-body"><h1 class="card-title text-2xl">Justifier une absence</h1><p>Étudiant : <strong>{{ absence.etudiant.prenom }} {{ absence.etudiant.nom }}</strong></p><p>Date : <strong>{{ absence.date }}</strong></p><p class="text-base-content/70">Motif : {{ absence.motif }}</p><form method="post" class="card-actions justify-end mt-4">{% csrf_token %}<a href="{% url 'dashboard_responsable' %}" class="btn btn-ghost">Annuler</a><button class="btn btn-success" type="submit">Confirmer</button></form></div></section></div>
{% endblock %}
