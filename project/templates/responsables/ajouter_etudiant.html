{% extends 'base.html' %}
{% block content %}
<div class="mx-auto max-w-2xl"><div class="mb-6"><h1 class="text-3xl font-bold">Ajouter un étudiant</h1><p class="text-base-content/70">Inscrivez un étudiant dans une classe existante.</p></div><section class="card bg-base-100 shadow"><form method="post" class="card-body gap-5">{% csrf_token %}<label class="form-control"><span class="label-text mb-1">Classe</span><select name="classe" class="select select-bordered w-full" required><option value="">Choisir une classe</option>{% for classe in classes %}<option value="{{ classe.id }}">{{ classe.filiere }} {{ classe.niveau }}</option>{% endfor %}</select></label><div class="grid gap-4 sm:grid-cols-2"><label class="form-control"><span class="label-text mb-1">Prénom</span><input name="prenom" class="input input-bordered w-full" required></label><label class="form-control"><span class="label-text mb-1">Nom</span><input name="nom" class="input input-bordered w-full" required></label></div><label class="form-control"><span class="label-text mb-1">Adresse</span><input name="adresse" class="input input-bordered w-full" required></label><div class="grid gap-4 sm:grid-cols-2"><label class="form-control"><span class="label-text mb-1">Téléphone</span><input name="telephone" maxlength="9" class="input input-bordered w-full" required></label><label class="form-control"><span class="label-text mb-1">E-mail</span><input name="email" type="email" class="input input-bordered w-full" required></label></div><div class="card-actions justify-end"><a href="{% url 'gestion_classes' %}" class="btn btn-ghost">Annuler</a><button class="btn btn-primary" type="submit">Ajouter l’étudiant</button></div></form></section></div>
{% endblock %}
