{% extends 'base.html' %}
{% block content %}
<div class="mx-auto max-w-xl">
    <div class="mb-6">
        <h1 class="text-3xl font-bold">Affecter un module</h1>
        <p class="text-base-content/70">Associez un module à un enseignant pour une année universitaire.</p>
    </div>
    <section class="card bg-base-100 shadow">
        <form method="post" class="card-body gap-5">
            {% csrf_token %}
            <label class="form-control">
                <span class="label-text mb-1">Module</span>
                <select id="module" name="module" class="select select-bordered w-full" required>
                    <option value="">Choisir un module</option>
                    {% for module in modules %}
                    <option value="{{ module.id }}">
                        {{ module.nom }} — {{ module.volHoraire }} h
                    </option>{% empty %}
                    <option disabled>
                        Aucun module disponible
                    </option>{% endfor %}
                </select>
            </label>
            <label class="form-control">
                <span class="label-text mb-1">Enseignant</span>
                <select id="enseignant" name="enseignant" class="select select-bordered w-full" required>
                    <option value="">Choisir un enseignant
                    </option>
                    {% for e in enseignants %}
                    <option value="{{ e.id }}">
                        {{ e.prenom }} {{ e.nom }}
                    </option>{% endfor %}
                </select>
            </label>
            <label class="form-control">
                <span class="label-text mb-1">Année universitaire</span>
                <input id="annee_universitaire" name="annee_universitaire" class="input input-bordered w-full" value="2025-2026" required>
            </label>
            <div class="card-actions justify-end">
                <a class="btn btn-ghost" href="{% url 'dashboard_responsable' %}">Annuler</a>
                <button class="btn btn-primary" type="submit">Enregistrer</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
