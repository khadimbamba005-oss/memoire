{% extends 'base.html' %}
{% block content %}
<div class="mx-auto max-w-3xl">
    <div class="mb-6">
        <p class="text-base-content/70">Appel </p>
    </div>
    <section class="card bg-base-100 shadow">
        <div class="card-body gap-6">
            <form method="get">
                <label class="form-control">
                    <span class="label-text mb-1">

                    </span>
                    <select name="classe" class="select select-bordered w-full" onchange="this.form.submit()">
                        <option value="">Choisir une classe
                        </option>
                        {% for c in classes %}
                        <option value="{{ c.id }}"
                        {% if selected_classe == c.id|stringformat:'s' %}
                        selected{% endif %}>
                        {{ c.filiere }} {{ c.niveau }}</option>
                        {% endfor %}
                    </select>
                </label>
            </form>
            {% if selected_classe %}
            <div class="divider">
            </div>

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <input type="hidden" name="classe" value="{{ selected_classe }}">

            <div class="overflow-x-auto">
                <div class="max-h-96 overflow-y-auto rounded-box border border-base-300">
                    {% for e in etudiants %}
                <label class="student flex cursor-pointer items-center gap-3 border-b border-base-200 p-3 last:border-0" data-student-id="{{ e.id }}">

                    <input type="checkbox" name="presents" 
                    value="{{ e.id }}" class="checkbox checkbox-primary presence-checkbox" checked
                    onchange="updateRowStatus(this)">

                    <span class="font-medium">{{ e.matricule }} {{ e.prenom }} {{ e.nom }}</span>

                    <div class="ml-auto flex items-center gap-2 justification-zone opacity-30 pointer-events-none transition-opacity duration-200">
                        <span class="text-xs text-base-content/60">Justifié ?</span>

                        <input type="checkbox" class="checkbox checkbox-warning checkbox-sm justification-checkbox"
                        name="justifies"
                        value="{{ e.id }}">
                    </div>

                    <span class="badge badge-success text-success-content status-badge min-w-[75px]  text-center" >Present</span>
                </label>
                {% empty %}
                <p class="p-4 text-base-content/60">Aucun(e) étudiant(e) dans cette classe.</p>{% endfor %}
            </div>
        </div>
        <div class="flex justify-end gap-2">
            <a href="{% url 'dashboard_enseignant' %}" class="btn btn-ghost">Annuler</a>
            <button class="btn btn-primary" type="submit">Enregistrer l’appel</button>
            </div>
        </form>
        {% else %}
        <div class="alert alert-info">
            <span>Choisissez une classe pour afficher ses étudiants.
            </span>
        </div>
        <div class="flex justify-end">
            <a href="{% url 'dashboard_enseignant' %}" class="btn btn-ghost">Annuler</a>
        </div>
        {% endif %}

        <!-- Script pour mettre absent ou present  -->

        <script>
            function updateRowStatus(checkbox)
            {
            const row = checkbox.closest('.student');
            if(!row) return;

            const badge = row.querySelector('.status-badge');
            const justificationZone = row.querySelector('.justification-zone');
            const justificationCheckbox = row.querySelector('.justification-checkbox');

            if(checkbox.checked)
        {
            badge.textContent = "Present";
            badge.className = "badge badge-success text-success-content status-badge min-w-[75px] text-center";
            
            if(justificationCheckbox) justificationCheckbox.checked = false;
            if(justificationZone)
        {
            justificationZone.classList.add('opacity-30','pointer-events-none');
        }
       } else {
        badge.textContent = "Absent";
        badge.className = "badge badge-error text-error-content status-badge min-w-[75px] text-center";

        if(justificationZone)
       {
        justificationZone.classList.remove('opacity-30','pointer-events-none');

       }
    }
}
        </script>
    </div>
    </section>
</div>
{% endblock %}
