{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6">

  <!-- En-tête de page -->
  <div class="flex items-center justify-between border-b border-slate-800 pb-4">
    <div>
      <p class="text-xs text-slate-400 mt-1">Émargement horaire et rédaction du cahier de texte synchronisés.</p>
    </div>
    <div class="badge badge-outline border-slate-700 font-mono text-xs px-3 py-2 text-slate-300" style="background-color: #1D4A7D;">
      {{ jour|date:"d F Y" }}
    </div>
  </div>

  <!-- Messages d'alertes Django -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %} shadow-md">
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  {% endif %}

  <!-- Formulaire Central Unique -->
  <form method="POST" action="." class="bg-[#ffffff] border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
    {% csrf_token %}

    <!-- Ligne 1 : Sélection Contexte de cours -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="form-control w-full">
        <label class="label"><span class="label-text font-bold text-slate-300">Classe concernée</span></label>
        <select name="classe" class="select select-bordered w-full bg-[#ffffff] border-slate-700 text-black focus:border-primary" required>
          <option value="" disabled selected>Sélectionnez la classe</option>
          {% for cl in classes %}
            <option value="{{ cl.id }}">{{ cl }}</option> <!-- Utilise le __str__ de la classe (filière/niveau) -->
          {% endfor %}
        </select>
      </div>

      <div class="form-control w-full">
        <label class="label"><span class="label-text font-bold text-slate-300">Module de cours</span></label>
        <select name="module" class="select select-bordered w-full bg-[#ffffff] border-slate-700 text-text-black focus:border-primary" required>
          <option value="" disabled selected>Sélectionnez le module</option>
          {% for m in modules %}
            <option value="{{ m.id }}">{{ m.nom }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Ligne 2 : Émargement Horaire -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-800/60 pt-4">
      <div class="form-control w-full">
        <label class="label"><span class="label-text font-bold text-slate-300">Heure d'arrivée (Début)</span></label>
        <input type="time" name="arrivee" class="input input-bordered w-full bg-[#ffffff] border-slate-700 text-text-black font-mono focus:border-primary" required>
      </div>

      <div class="form-control w-full">
        <label class="label"><span class="label-text font-bold text-slate-300">Heure de départ (Fin)</span></label>
        <input type="time" name="depart" class="input input-bordered w-full bg-[#ffffff] border-slate-700 text-text-black font-mono focus:border-primary" required>
      </div>
    </div>

    <!-- Ligne 3 : Cahier de texte (Contenu) -->
    <div class="form-control w-full border-t border-slate-800/60 pt-4">
      <label class="label">
        <span class="label-text font-bold text-text-black">Contenu du Cahier de Texte</span>
        <span class="label-text-alt text-slate-500">Détaillez les chapitres traités ou travaux dirigés effectués</span>
      </label>
      <textarea name="contenu" placeholder="Ex: Chapitre 3 : Structures conditionnelles, Exercices d'application 1 à 4 effectués en groupe..." 
                class="textarea textarea-bordered min-h-[120px] w-full bg-[#ffffff] border-slate-700 text-text-black focus:border-primary resize-y" required></textarea>
    </div>

    <!-- Actions du bas -->
    <div class="flex items-center justify-between border-t border-slate-800 pt-4 mt-2">
      <a href="{% url 'dashboard_enseignant' %}" class="btn btn-ghost btn-sm text-slate-400 hover:text-slate-200">
        Annuler
      </a>
      <button type="submit" class="btn btn-primary btn-md gap-2 font-bold px-6 shadow-lg shadow-primary/20">
        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Valider et Enregistrer la Séance
      </button>
    </div>

  </form>
</div>
{% endblock %}
